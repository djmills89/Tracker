<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Time tracking dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/style.css">
</head>
<body>

  <template id="template">
    <section class="container">
      <div class="card__bg"></div>
      <div class="card">
        <div class="card__title-header">
          <h2 class="title text-preset-5-medium" data-title="">Work</h2>
          <p class="menu text-preset-5-medium">...</p>
        </div>
        <p class="time text-preset-1" data-current-time="">32hrs</p>
        <p class="previous-time text-preset-6" data-previous-time="">Last Week - 36hrs</p>
      </div>
    </section>
  </template>

  <main>
    <section class="tracking-container">

      <div class="profile">
        <div class="profile__container">
          <div class="profile__image">
            <img src="./images/image-jeremy.png" alt="">
          </div>

          <div class="profile__report">
            <p class="text-preset-6">Report For</p>
            <h1 class="text-preset-2">Jeremy Robson</h1>
          </div>
        </div>

        <div class="profile__filters">
          <p class="text-preset-5 daily">Daily</p>
          <p class="filters__active text-preset-5 weekly">Weekly</p>
          <p class="text-preset-5 monthly">Monthly</p>
        </div>
      </div>

      <div class="card-container" id="cardContainer">

      </div>

    </section>

  </main>
  
<script src="./script/script.js"></script>
</body>
</html>
